# Builds and checks the website for every pull request and every change on main.
# A red ✗ means: do not merge – the build log lists the problem (e.g. a missing frontmatter field).
name: Build & check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # daily at 04:15 UTC (06:15 South Africa): scheduled posts appear, past events disappear.
  # Once hosting is connected, the deploy step / deploy hook is added here as well.
  schedule:
    - cron: "15 4 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (live version)
        run: npm run build
      - name: Check links, metadata, feeds
        run: npm run check
      - name: Build preview version (drafts visible)
        run: npm run build:preview
      # Daily rebuild of the hosted site (scheduled posts, past events). Needs the repository secret DEPLOY_HOOK_URL
      # (Cloudflare Pages: Settings → Builds → Deploy hooks). Without the secret this step does nothing.
      - name: Trigger daily deploy
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$DEPLOY_HOOK_URL" && echo "Deploy triggered"; else echo "No DEPLOY_HOOK_URL secret set - skipping"; fi
